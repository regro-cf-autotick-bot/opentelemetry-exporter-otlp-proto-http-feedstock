schema_version: 1

context:
  name: opentelemetry-exporter-otlp-proto-http
  version: 1.45.2
  version_minor: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_exporter_otlp_proto_http-${{ version }}.tar.gz
  sha256: 5984a3fb46bc4628e4e2b85d4a6e72637e03962aae6cf372791137768a4ad939

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - typing_extensions >=4.5.0
    - python >=${{ python_min }}
    - googleapis-common-protos >=1.52,<2.dev0
    - opentelemetry-api >=1.15,<2.dev0
    - opentelemetry-proto ${{ version }}.*
    - opentelemetry-sdk ${{ version_minor }}.*
    - opentelemetry-exporter-http-transport ==0.66b2
    - opentelemetry-exporter-otlp-common ==0.66b2
    - opentelemetry-exporter-otlp-proto-common ${{ version }}.*
    - requests >=2.7,<3.dev0
    - opentelemetry-proto ==1.45.2
    - opentelemetry-exporter-otlp-proto-common ==1.45.2
    - opentelemetry-sdk >=1.45.2,<1.46.dev0
tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.exporter
        - opentelemetry.exporter.otlp.proto.http
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: OpenTelemetry Collector Protobuf over HTTP Exporter
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-http

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - conda-forge/opentelemetry-api
    - conda-forge/opentelemetry-proto
    - conda-forge/opentelemetry-sdk
    - conda-forge/opentelemetry-exporter-otlp-proto-common
    - xhochy
